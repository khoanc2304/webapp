plugins {
    id 'java'
    id 'war'
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    jcenter()
}

ext {
    junitVersion = '5.10.2'
}

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    compileOnly('javax.servlet:javax.servlet-api:4.0.1')

    implementation group: 'javax.servlet', name: 'jstl', version: '1.2'
    implementation group: 'mysql', name: 'mysql-connector-java', version: '8.0.33'

//    //Thư viện logging của Apache.
//    implementation 'org.apache.commons:commons-logging:1.1.3'

    implementation 'org.json:json:20230227'
    //Thư viện HTTP Client từ Apache.
    implementation 'org.apache.httpcomponents:httpclient:4.5.5'

    //Thư viện hỗ trợ HTTP Core từ Apache.
    implementation 'org.apache.httpcomponents:httpcore:4.4.9'

    //Thư viện Gson từ Google
    implementation 'com.google.code.gson:gson:2.8.2'

    //Một thư viện của Apache HTTP Components giúp dễ dàng xử lý các kết nối HTTP.
    implementation 'org.apache.httpcomponents:fluent-hc:4.5.5'
    implementation 'com.microsoft.sqlserver:mssql-jdbc:9.4.1.jre8' // Hoặc phiên bản phù hợp với dự án của bạn


    implementation 'com.sun.mail:javax.mail:1.6.2' // JavaMail API cho JDK 8
    implementation 'javax.activation:activation:1.1.1' // Cần thiết cho JavaMail API trên JDK 8

    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
}

test {
    useJUnitPlatform()
}